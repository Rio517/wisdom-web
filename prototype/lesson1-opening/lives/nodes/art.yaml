# Art and making pictures: drawing, painting, crafts, design, photography.
# The schema and the rules are in ../README.md.

- id: paintsAtHome
  label: Paints and glues
  line: "Paper, paint and glue cover the kitchen table."
  if: "{his} family had left paper and paint on the kitchen table"
  kind: choice
  by: family
  ages: [3, 7]
  tags: [art, drawing, crafts]

- id: artClub
  label: Joins the art club
  line: "{name} joins the art club after school."
  if: "{name} had joined the art club"
  kind: choice
  ages: [7, 11]
  tags: [art, drawing, club]

- id: drawsEveryDay
  label: Draws every day
  line: "{name} draws every day, in the back of every notebook."
  if: "{name} had drawn every day"
  kind: choice
  ages: [9, 15]
  tags: [art, drawing]

- id: triesPottery
  label: Tries pottery
  line: "{name} tries pottery and gets very muddy."
  if: "{name} had tried pottery"
  kind: choice
  ages: [8, 14]
  tags: [art, crafts, pottery]

- id: borrowsACamera
  label: Borrows a camera
  line: "{name} borrows a camera and looks at the world through it."
  if: "{name} had borrowed a camera"
  kind: choice
  ages: [9, 15]
  tags: [art, photography]

- id: learnsToSew
  label: Learns to sew
  line: "{name} learns to sew on {his} aunt's old sewing machine."
  if: "{name} had learned to sew"
  kind: choice
  ages: [8, 14]
  tags: [art, crafts, sewing]

- id: givenOldCamera
  label: Gets an old camera
  line: "{his} grandad passes on his old camera. Luck!"
  kind: lucky
  ages: [9, 16]
  unless: [photography]
  tags: [art, photography]
  move: 1
  weight: 0.6

- id: focusOnArt
  label: Focuses on art
  line: "{name} chooses art as a main subject."
  if: "{name} had focused on art"
  kind: choice
  ages: [14, 19]
  after: [drawing, crafts, photography]
  tags: [art, artSubject]

- id: entersArtContest
  label: Enters an art contest
  line: "{name} sends a picture to a local art contest."
  if: "{name} had entered an art contest"
  kind: choice
  ages: [11, 19]
  after: [drawing, crafts, photography]
  tags: [art, contest]

- id: artShowSpot
  label: A café hangs the work
  line: "A café owner hangs {his} pictures on the wall. Luck!"
  kind: lucky
  ages: [12, 30]
  after: [drawing, crafts, photography]
  tags: [art]
  move: 1

- id: appliesToArtSchool
  label: Applies to art school
  line: "{name} sends {his} best drawings to an art school."
  if: "{name} had applied to art school"
  kind: choice
  ages: [17, 24]
  after: [artSubject, drawsEveryDay, artClub]
  tags: [art, portfolio]

- id: getsArtSchoolPlace
  label: Gets into art school
  line: "An art school offers {him} a place. Luck!"
  kind: lucky
  ages: [17, 26]
  after: [portfolio]
  unless: [artSchoolSaysNo]
  tags: [art, study]
  move: 1

- id: artSchoolSaysNo
  label: Art school says no
  line: "The art school says no. It stings."
  kind: setback
  ages: [17, 26]
  after: [portfolio]
  unless: [getsArtSchoolPlace]
  tags: [art]
  move: -2

- id: studiesDesign
  label: Studies design
  line: "{name} studies graphic design: posters, signs and book covers."
  if: "{name} had studied design"
  kind: choice
  ages: [17, 30]
  after: [artSubject, artSchoolSaysNo]
  tags: [art, design, study]

- id: worksInPrintShop
  label: Works in a print shop
  line: "{name} works in a print shop, among paper and ink."
  if: "{name} had worked in a print shop"
  kind: choice
  ages: [18, 60]
  after: [artSchoolSaysNo, drawing, design, portfolio]
  tags: [art, job, print]

- id: freelanceIllustrator
  label: Draws for clients
  line: "{name} draws pictures for clients, one job at a time."
  if: "{name} had drawn pictures for clients"
  kind: choice
  ages: [20, 60]
  after: [design, drawing]
  tags: [art, job, illustration]

- id: childrensBookJob
  label: Draws a picture book
  line: "A publisher asks {him} to draw a children's book. Luck!"
  kind: lucky
  ages: [22, 60]
  after: [illustration, print]
  tags: [art, job]
  move: 2

- id: teachesArt
  label: Teaches art
  line: "{name} teaches art classes to children and grown-ups."
  if: "{name} had taught art classes"
  kind: choice
  ages: [25, 65]
  after: [drawing, crafts, painting]
  tags: [art, teaching, job]

- id: sellsAtCraftMarket
  label: Sells at craft fairs
  line: "{name} sells handmade things at weekend craft fairs."
  if: "{name} had sold crafts at fairs"
  kind: choice
  ages: [18, 60]
  after: [crafts]
  tags: [art, job, market, money]

- id: learnsToPaint
  label: Learns to paint
  line: "{name} signs up for a painting class."
  if: "{name} had learned to paint"
  kind: choice
  ages: [14, 80]
  tags: [art, painting]
  weight: 0.8

- id: paintsAMural
  label: Paints a wall mural
  line: "{name} paints a mural on a long grey wall."
  if: "{name} had painted a mural"
  kind: choice
  ages: [20, 60]
  after: [painting, drawing]
  tags: [art, painting, community]

- id: photographsWeddings
  label: Photographs weddings
  line: "{name} photographs weddings and birthdays."
  if: "{name} had photographed weddings"
  kind: choice
  ages: [18, 60]
  after: [photography]
  tags: [art, job]

- id: photographsWildPlaces
  label: Photographs nature
  line: "{name} hikes out at dawn to photograph wild places."
  if: "{name} had photographed wild places"
  kind: choice
  ages: [16, 60]
  after: [photography]
  tags: [art, nature]

- id: drawsForGames
  label: Draws game characters
  line: "{name} draws characters for a games studio."
  if: "{name} had drawn characters for games"
  kind: choice
  ages: [20, 55]
  after: [drawing, design]
  tags: [art, games, job]

- id: workRuined
  label: Rain ruins {his} work
  line: "Rain leaks in and spoils a year of {his} work."
  kind: setback
  ages: [18, 60]
  after: [drawing, painting, crafts, photography]
  tags: [art]
  move: -2

- id: startsAgain
  label: Starts over
  line: "{name} starts again from scratch, bolder this time."
  if: "{name} had started the work again"
  kind: choice
  ages: [18, 60]
  after: [workRuined]
  tags: [art]
  within: 2

- id: joinsSharedStudio
  label: Joins a shared studio
  line: "{name} joins a shared studio with other artists."
  if: "{name} had joined a shared studio"
  kind: choice
  ages: [18, 60]
  after: [workRuined, artSchoolSaysNo]
  tags: [art, helped]
  within: 2

- id: keepsMakingArt
  label: Keeps making art
  line: "{name} keeps making art at the kitchen table anyway."
  if: "{name} had kept making art anyway"
  kind: choice
  ages: [17, 30]
  after: [artSchoolSaysNo]
  tags: [art, drawing]
  within: 2

- id: sportsPhotographer
  label: Photographs sport
  line: "{name} photographs matches for the local paper."
  if: "{name} had photographed matches"
  kind: choice
  ages: [18, 60]
  after: [photography]
  needs: [sport]
  tags: [art, job]

- id: paintsLandscapes
  label: Paints the countryside
  line: "{name} paints the hills and fields near home."
  if: "{name} had painted the countryside"
  kind: choice
  ages: [16, 80]
  after: [outdoors]
  tags: [art, painting]

- id: opensGalleryShop
  label: Opens a gallery shop
  line: "{name} opens a small shop selling local art."
  if: "{name} had opened a gallery shop"
  kind: choice
  ages: [25, 60]
  after: [savings]
  needs: [drawing]
  tags: [art, owner, business, shop]

- id: paintsStageSets
  label: Paints stage sets
  line: "{name} paints the scenery for stage shows."
  if: "{name} had painted stage scenery"
  kind: choice
  ages: [18, 60]
  after: [theatre]
  tags: [art, job]

- id: designsCostumes
  label: Designs costumes
  line: "{name} designs and sews costumes for the stage."
  if: "{name} had designed costumes"
  kind: choice
  ages: [16, 60]
  after: [sewing, theatre]
  tags: [art, job]

- id: designsWebsites
  label: Designs websites
  line: "{name} designs websites that are easy to read."
  if: "{name} had designed websites"
  kind: choice
  ages: [18, 60]
  after: [design, websites]
  tags: [art, job]
