# Community: teaching, volunteering, clubs, helping a town.
# The schema and the rules are in ../README.md.

- id: familyVolunteers
  label: Helps at the fair
  line: "{his} aunt helps at the town fair, and {name} hands out cakes."
  if: "{his} family had helped at the town fair"
  kind: choice
  by: family
  ages: [4, 8]
  tags: [community, volunteer]

- id: helpsAtTownFair
  label: Helps at town events
  line: "{name} helps set up chairs at town events."
  if: "{name} had helped at town events"
  kind: choice
  ages: [8, 14]
  tags: [community, volunteer]

- id: readsToYounger
  label: Reads to little ones
  line: "{name} reads to younger children at the library."
  if: "{name} had read to younger children"
  kind: choice
  ages: [10, 15]
  tags: [community, helper, volunteer]

- id: startsSchoolClub
  label: Starts a school club
  line: "{name} starts a club at school and finds twelve members."
  if: "{name} had started a club at school"
  kind: choice
  ages: [11, 17]
  tags: [community, club, leader]

- id: joinsYouthCouncil
  label: Joins a youth council
  line: "{name} joins the town's youth council and speaks up for young people."
  if: "{name} had joined the youth council"
  kind: choice
  ages: [11, 16]
  tags: [community, civic]

- id: peerHelper
  label: Helps new pupils
  line: "{name} helps younger pupils settle in."
  if: "{name} had helped new pupils settle in"
  kind: choice
  ages: [12, 18]
  after: [helper, club, volunteer]
  tags: [community, helper, mentoring]

- id: trainsToTeach
  label: Trains to teach
  line: "{name} trains to be a teacher."
  if: "{name} had trained to teach"
  kind: choice
  ages: [21, 30]
  after: [peerHelper, helper, study]
  tags: [community, teaching, study]

- id: teachesAtSchool
  label: Becomes a teacher
  line: "{name} becomes a teacher and learns thirty new names."
  if: "{name} had taught at a school"
  kind: choice
  ages: [22, 65]
  after: [trainsToTeach, teaching]
  tags: [community, teaching, job]

- id: volunteersLocally
  label: Volunteers locally
  line: "{name} volunteers in the neighbourhood every week."
  if: "{name} had volunteered locally"
  kind: choice
  ages: [20, 70]
  tags: [community, volunteer]
  weight: 0.8

- id: mentorsSomeone
  label: Guides a beginner
  line: "{name} helps someone new at work find their feet."
  if: "{name} had helped someone new find their feet"
  kind: choice
  ages: [24, 65]
  after: [job]
  tags: [community, mentoring]

- id: teachesACraft
  label: Teaches {his} craft
  line: "{name} teaches others a craft learned over many years."
  if: "{name} had taught others {his} craft"
  kind: choice
  ages: [28, 70]
  after: [qualified, chef, baker, crafts, painting, wood]
  tags: [community, teaching]

- id: runsFoodBank
  label: Helps run a food bank
  line: "{name} helps run a food bank in the community hall."
  if: "{name} had helped run a food bank"
  kind: choice
  ages: [22, 65]
  tags: [community, volunteer]
  weight: 0.8

- id: campaignsForLibrary
  label: Fights for the library
  line: "{name} starts a campaign to save the town library."
  if: "{name} had campaigned to save the library"
  kind: choice
  ages: [25, 65]
  after: [volunteer, civic, library]
  tags: [community, campaign]
  weight: 2

- id: councilSaysNo
  label: The council says no
  line: "The council says no to the library campaign."
  kind: setback
  ages: [25, 65]
  after: [campaign]
  tags: [community]
  move: -1
  weight: 2

- id: triesAgain
  label: Tries again together
  line: "{name} knocks on doors and tries again with neighbours."
  if: "{name} had tried again with the neighbours"
  kind: choice
  ages: [24, 65]
  after: [councilSaysNo, fundingEnds]
  tags: [community]
  within: 2

- id: startsLittleLibrary
  label: Starts a tiny library
  line: "{name} builds a little free library on {his} street."
  if: "{name} had built a little library on {his} street"
  kind: choice
  ages: [20, 70]
  after: [councilSaysNo, library]
  tags: [community, words, library]

- id: townBacksCampaign
  label: Neighbours join in
  line: "Hundreds of neighbours sign {his} petition. Luck helps!"
  kind: lucky
  ages: [25, 65]
  after: [campaign]
  tags: [community]
  move: 2

- id: runsYouthClub
  label: Runs a youth club
  line: "{name} runs a youth club on Friday nights."
  if: "{name} had run a youth club"
  kind: choice
  ages: [22, 65]
  after: [volunteer, teaching, leader]
  tags: [community, youthGroup, volunteer]
  weight: 2

- id: fundingEnds
  label: The money runs out
  line: "The money runs out, and the group loses its room."
  kind: setback
  ages: [24, 65]
  after: [youthGroup]
  tags: [community]
  move: -2

- id: asksShopsForHelp
  label: Asks shops to chip in
  line: "{name} asks local shops to chip in."
  if: "{name} had asked local shops for help"
  kind: choice
  ages: [24, 65]
  after: [fundingEnds]
  tags: [community, helped]
  within: 2

- id: movesToSchoolHall
  label: Uses the school hall
  line: "{name} moves the group to the school hall, rent-free."
  if: "{name} had moved the group to the school hall"
  kind: choice
  ages: [24, 65]
  after: [fundingEnds]
  tags: [community]
  within: 2

- id: roomOffered
  label: Gets a free room
  line: "A shop owner offers the group a free room. Luck!"
  kind: lucky
  ages: [22, 65]
  after: [youthGroup]
  tags: [community]
  move: 1

- id: joinsTownCouncil
  label: Joins the town council
  line: "{name} wins a seat on the town council."
  if: "{name} had joined the town council"
  kind: choice
  ages: [28, 65]
  after: [campaign, volunteer, civic]
  tags: [community, civic]

- id: welcomesNeighbours
  label: Welcomes neighbours
  line: "{name} welcomes new neighbours with a plate of food."
  if: "{name} had welcomed new neighbours"
  kind: choice
  ages: [20, 70]
  tags: [community, volunteer]
  weight: 0.7

- id: helpsNewcomersSettle
  label: Helps a family settle
  line: "{name} helps a newly arrived family find school and work."
  if: "{name} had helped a new family settle in"
  kind: choice
  ages: [22, 65]
  after: [volunteer, languages]
  tags: [community, volunteer]

- id: leadsScoutGroup
  label: Leads a scout group
  line: "{name} leads a scout group on Thursday evenings."
  if: "{name} had led a scout group"
  kind: choice
  ages: [20, 60]
  after: [outdoors]
  tags: [community, volunteer, teaching]

- id: coachesTownTeam
  label: Coaches a town team
  line: "{name} coaches a town team that plays on Sunday mornings."
  if: "{name} had coached a town team"
  kind: choice
  ages: [20, 65]
  after: [coaching]
  tags: [community, volunteer, teaching]

- id: teachesTradeSkills
  label: Teaches trade skills
  line: "{name} teaches trade skills at the local college."
  if: "{name} had taught trade skills"
  kind: choice
  ages: [28, 65]
  after: [qualified]
  tags: [community, teaching, job]

- id: visitsLonelyNeighbours
  label: Visits neighbours
  line: "{name} visits older neighbours who live alone."
  if: "{name} had visited older neighbours"
  kind: choice
  ages: [20, 70]
  after: [carer]
  tags: [community, volunteer]

- id: runsDramaWorkshops
  label: Runs drama workshops
  line: "{name} runs drama workshops in the town hall."
  if: "{name} had run drama workshops"
  kind: choice
  ages: [20, 65]
  after: [drama, theatre]
  tags: [community, teaching, volunteer]

- id: cooksForFoodBank
  label: Cooks for a food bank
  line: "{name} cooks hot meals for the food bank."
  if: "{name} had cooked for the food bank"
  kind: choice
  ages: [20, 65]
  after: [cooking]
  tags: [community, volunteer]

- id: teachesDigitalSkills
  label: Teaches computing
  line: "{name} shows older neighbours how to use a computer."
  if: "{name} had taught neighbours to use computers"
  kind: choice
  ages: [22, 65]
  after: [code, computers]
  tags: [community, teaching, volunteer]

# Run steps (see runs/community.yaml): a petition the council refuses, a club
# nobody comes to at first, and a study room that closes.
- id: startsPetition
  label: Starts a petition
  line: "{name} starts a petition for a safe crossing outside the school."
  if: "{name} had started a petition for a safe crossing"
  kind: choice
  ages: [14, 65]
  after: [community]
  unless: [campaign]
  tags: [community, civic, petition]
  inRun: true

- id: councilNoMoney
  label: Council says no money
  line: "The council says there is no money for a crossing."
  kind: setback
  ages: [14, 66]
  after: [startsPetition]
  tags: [community]
  within: 1
  move: -1

- id: takesPetitionDoors
  label: Takes it door to door
  line: "{name} takes the petition from door to door with a clipboard."
  if: "{name} had taken the petition door to door"
  kind: choice
  ages: [14, 66]
  after: [councilNoMoney]
  tags: [community, helped]
  within: 1

- id: crossingPainted
  label: A crossing is painted
  line: "The council paints one crossing, on the busier of two roads."
  kind: event
  ages: [14, 67]
  after: [takesPetitionDoors]
  tags: [community, civic]
  within: 1
  move: 1

- id: opensClub
  label: Opens a weekly club
  line: "{name} opens a weekly games club in the village hall."
  if: "{name} had opened a weekly club"
  kind: choice
  ages: [14, 65]
  after: [community]
  unless: [startsSchoolClub]
  tags: [community, club, leader]
  inRun: true

- id: nobodyComes
  label: Nobody comes at first
  line: "Rain falls on the first night, and nobody comes."
  kind: setback
  ages: [14, 66]
  after: [opensClub]
  tags: [community]
  within: 1
  move: -1

- id: movesClubTime
  label: Moves it to Saturdays
  line: "{name} moves the club to Saturday mornings at the library."
  if: "{name} had moved the club to Saturday mornings"
  kind: choice
  ages: [14, 66]
  after: [nobodyComes]
  tags: [community]
  within: 1

- id: clubFillsUp
  label: The club fills up
  line: "Twelve people come, then a few more each week."
  kind: event
  ages: [14, 67]
  after: [movesClubTime]
  tags: [community, club]
  within: 1
  move: 1

- id: offersHomeworkHelp
  label: Offers homework help
  line: "{name} offers free homework help at the library on Wednesdays."
  if: "{name} had offered homework help"
  kind: choice
  ages: [16, 60]
  after: [community]
  tags: [community, volunteer]
  inRun: true

- id: studyRoomCloses
  label: The study room shuts
  line: "The library closes its study room for repairs."
  kind: setback
  ages: [16, 61]
  after: [offersHomeworkHelp]
  tags: [community]
  within: 1
  move: -1

- id: takesShortCourse
  label: Takes a short course
  line: "{name} signs up for a short course on helping in classrooms."
  if: "{name} had signed up for a classroom course"
  kind: choice
  ages: [16, 62]
  after: [studyRoomCloses]
  tags: [community, study]
  within: 1

- id: helpsInClassroom
  label: Helps in a classroom
  line: "{name} starts work helping in a primary school classroom."
  if: "{name} had started work in a classroom"
  kind: choice
  ages: [17, 63]
  after: [takesShortCourse]
  tags: [community, teaching, job]
  within: 1
