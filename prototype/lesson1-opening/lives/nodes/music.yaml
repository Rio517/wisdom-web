# Music: singing, instruments, bands, songs, records, teaching music.
# The schema and the rules are in ../README.md.

- id: choir
  label: Joins a choir
  line: "{his} parents sign {him} up for choir."
  if: "{his} parents had picked choir"
  kind: choice
  by: family
  ages: [4, 9]
  tags: [music, sings]

- id: singsAtHome
  label: Sings at home
  line: "Music fills the house, and {name} sings along."
  if: "{his} family had filled the house with music"
  kind: choice
  by: family
  ages: [3, 8]
  tags: [music, sings]

- id: startPiano
  label: Starts piano lessons
  line: "{name} starts piano lessons."
  if: "{name} had started piano lessons"
  kind: choice
  ages: [7, 11]
  tags: [music, instrument, piano]

- id: startsViolin
  label: Starts the violin
  line: "{name} starts the violin. The first squeaks are rough."
  if: "{name} had started the violin"
  kind: choice
  ages: [7, 12]
  tags: [music, instrument, strings]

- id: guitar
  label: Picks guitar
  line: "{name} picks guitar."
  if: "{name} had picked guitar"
  kind: choice
  ages: [7, 16]
  tags: [music, instrument]

- id: drums
  label: Picks drums
  line: "{name} picks drums."
  if: "{name} had picked drums"
  kind: choice
  ages: [7, 16]
  tags: [music, instrument, drumming]

- id: joinsChoir
  label: Joins the school choir
  line: "{name} joins the school choir."
  if: "{name} had joined the school choir"
  kind: choice
  ages: [8, 14]
  tags: [music, sings, ensemble]

- id: schoolBand
  label: Joins the school band
  line: "{name} joins the school band."
  if: "{name} had joined the school band"
  kind: choice
  ages: [9, 15]
  after: [instrument]
  tags: [music, ensemble]

- id: switchesToDrums
  label: Switches to drums
  line: "{name} swaps the piano stool for a drum stool."
  if: "{name} had switched from piano to drums"
  kind: choice
  ages: [10, 15]
  after: [piano]
  unless: [drums]
  tags: [music, instrument, drumming]

- id: jamsWithFriends
  label: Jams with friends
  line: "{name} makes music with friends after school."
  if: "{name} had made music with friends"
  kind: choice
  ages: [13, 19]
  after: [instrument, sings]
  unless: [band]
  tags: [music, jamming]

- id: startsBand
  label: Starts a band
  line: "{name} starts a band with two friends."
  if: "{name} had started a band"
  kind: choice
  ages: [12, 19]
  after: [instrument, sings]
  unless: [band]
  tags: [music, band]

- id: bandInvite
  label: An older band invites
  line: "An older band asks {him} to join. Luck!"
  kind: lucky
  ages: [12, 22]
  after: [instrument, sings]
  unless: [band]
  tags: [music, band]
  move: 1

- id: playGigs
  label: Plays weekend gigs
  line: "{name} plays gigs at weekends."
  if: "{name} had played weekend gigs"
  kind: choice
  ages: [14, 30]
  after: [band, jamming, ensemble]
  tags: [music, gigs]

- id: ownSong
  label: Writes a song
  line: "The band writes its own song."
  if: "{name}'s band had written its own song"
  kind: choice
  ages: [13, 25]
  after: [band]
  tags: [music, songs]

- id: radioPlay
  label: A DJ plays the song
  line: "A radio DJ plays {his} song. Luck!"
  kind: lucky
  ages: [15, 40]
  after: [songs]
  tags: [music]
  move: 1

- id: recordDeal
  label: Signs a record deal
  line: "A record label offers {him} a deal."
  kind: event
  ages: [17, 40]
  after: [radioPlay]
  tags: [music, fame]
  within: 2
  move: 1

- id: recordsAlbum
  label: Records an album
  line: "{name} records an album in a small studio."
  if: "{name} had recorded an album"
  kind: choice
  ages: [18, 45]
  after: [fame, radioPlay]
  unless: [album]
  tags: [music, album]

- id: partiesEveryNight
  label: Parties every night
  line: "Fame. Late nights, bad habits, money gone."
  if: "{name} had partied every night"
  kind: choice
  ages: [18, 40]
  after: [fame]
  tags: [music, hardLiving]

- id: keepsEarlyNights
  label: Keeps early nights
  line: "{name} keeps early nights, even on tour."
  if: "{name} had kept early nights"
  kind: choice
  ages: [18, 40]
  after: [fame]
  tags: [music]

- id: savesTheMoney
  label: Saves the money
  line: "{name} puts the money away for later."
  if: "{name} had saved the money"
  kind: choice
  ages: [18, 45]
  after: [fame]
  tags: [music, savings]

- id: bandSplits
  label: The band splits
  line: "The band splits up."
  kind: setback
  ages: [16, 45]
  after: [band]
  tags: [music]
  drops: [band]
  move: -2

- id: handInjury
  label: Hurts a hand
  line: "{name} hurts a hand and cannot play for a year."
  kind: setback
  ages: [15, 45]
  after: [instrument]
  tags: [music, injury]
  move: -2

- id: switchesInstrument
  label: Tries a new instrument
  line: "{name} learns a different instrument while the hand heals."
  if: "{name} had tried a new instrument"
  kind: choice
  ages: [15, 50]
  after: [handInjury]
  tags: [music, instrument]
  within: 2

- id: writesForOthers
  label: Writes for others
  line: "{name} writes songs for other people to sing."
  if: "{name} had written songs for other people"
  kind: choice
  ages: [16, 60]
  after: [handInjury, bandSplits, radioPlay]
  tags: [music, songs]
  within: 2

- id: teachesMusic
  label: Teaches music
  line: "{name} starts teaching music to children."
  if: "{name} had started teaching music"
  kind: choice
  ages: [18, 65]
  after: [handInjury, bandSplits]
  tags: [music, teaching]
  within: 2

- id: goesSolo
  label: Plays solo gigs
  line: "{name} plays alone now, with a stool and one microphone."
  if: "{name} had gone solo"
  kind: choice
  ages: [16, 45]
  after: [bandSplits]
  tags: [music, gigs]
  within: 2

- id: givesMusicLessons
  label: Gives music lessons
  line: "{name} gives music lessons."
  if: "{name} had given music lessons"
  kind: choice
  ages: [16, 70]
  after: [instrument]
  tags: [music, teaching]

- id: teachesSchoolMusic
  label: Teaches at a school
  line: "{name} teaches music at the local school."
  if: "{name} had taught at a school"
  kind: choice
  ages: [22, 65]
  after: [teaching]
  needs: [music]
  tags: [music, teacher]

- id: watchesChildPerform
  label: Watches child perform
  line: "{name} watches {his} child perform on stage."
  kind: event
  ages: [30, 70]
  after: [parent]
  needs: [music]
  tags: [music]
  move: 1

- id: studiesMusic
  label: Studies music
  line: "{name} goes to college to study music."
  if: "{name} had studied music"
  kind: choice
  ages: [17, 26]
  after: [instrument, sings]
  tags: [music, study]

- id: joinsAdultChoir
  label: Joins a local choir
  line: "{name} joins a local choir that meets on Tuesdays."
  if: "{name} had joined a local choir"
  kind: choice
  ages: [25, 80]
  tags: [music, sings, ensemble]
