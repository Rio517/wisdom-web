# Money: first jobs, saving, shops, starting a business.
# The schema and the rules are in ../README.md.

- id: pocketMoneyChores
  label: Pocket money
  line: "{his} parents give {him} pocket money for small chores."
  if: "{his} parents had given {him} pocket money for chores"
  kind: choice
  by: family
  ages: [5, 9]
  tags: [money, savings]

- id: savesInJar
