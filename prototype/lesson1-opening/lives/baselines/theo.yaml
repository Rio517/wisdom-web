    age: 18
    echoes: [volunteerClinic]
  - node: nurseTraining
    age: 19
    alts: [studiesMedicine, paramedic]
    echoes: [volunteerClinic, helpsAtHome]
  - node: nurseMentor
    age: 22
    line: "A senior nurse takes him under a wing. Luck!"
    echoes: [nurseTraining]
  - node: midwife
    age: 26
    alts: [teachesFirstAid, paramedic]
