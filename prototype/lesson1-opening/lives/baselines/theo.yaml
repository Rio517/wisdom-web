# Theo: caring, a parent's long illness at 10, nurse training, a mentor, a hospital that closes, and a move for work.
# The schema is in ../README.md.

id: theo
name: Theo
pronoun: he
end: 42
steps:
  - { node: born, age: 0 }
  - node: familyHelpsNeighbours
    age: 4
    alts: [singsAtHome, oldComputerAtHome]
  - node: parentIll
    age: 10
    line: "A parent becomes very ill for a long time."
  - node: helpsAtHome
    age: 11
    alts: [asksTeacherForHelp, looksAfterYounger]
  - node: firstAid
    age: 12
    alts: [roboticsClub, takesUpRunning]
