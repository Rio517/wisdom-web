# Ana: food, slow and steady, a bakery of her own, the rent doubling, and a way
# back sideways with a business partner.
# The schema is in ../README.md.

id: ana
name: Ana
pronoun: she
end: 41
steps:
  - { node: born, age: 0 }
  - node: helpBake
    age: 3
    alts: [timeWithGrandparents, nurseryWithFriends]
  - node: bakeSale
    age: 9
    alts: [learnsFamilyRecipes, chessClub]
    echoes: [helpBake]
  - node: cafeJob
    age: 14
    alts: [paperRound, babysits]
    echoes: [bakeSale]
  - node: chefOffer
    age: 17
    label: A baker takes her on
    line: "A baker sees her work and offers to train her. Luck!"
    echoes: [cafeJob]
  - node: trainsAsBaker
    age: 18
    alts: [trainChef, goesToUniversity]
    echoes: [chefOffer]
  - node: worksInKitchen
    age: 22
    line: "She bakes the bread for a busy restaurant."
    alts: [cooksSchoolLunches, studiesFoodScience]
    echoes: [trainsAsBaker]
  - node: openBakery
    age: 27
    label: Opens her own bakery
    line: "She opens a small bakery of her own."
    alts: [startsFoodTruck, caters]
    echoes: [trainsAsBaker, worksInKitchen]
  - node: happyCustomer
    age: 31
    line: "Word spreads, and the queue grows. Luck!"
    move: 1
  - node: rentDoubles
    age: 34
  - node: teamsUpWithPartner
    age: 35
    move: 1
    alts: [marketStall, smallerShop]
  - node: caters
    age: 38
    label: Cooks for weddings
    line: "She and her partner bake for weddings and parties too."
    echoes: [openBakery]
  - node: teachesCooking
    age: 41
    line: "She teaches children to bake, flour and all."
    move: 1
    echoes: [helpBake]
