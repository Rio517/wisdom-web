# Noah: sport, an early peak at the academy, a knee injury at 17, and a long rebuild into coaching.
# The schema is in ../README.md.

id: noah
name: Noah
pronoun: he
end: 41
steps:
  - { node: born, age: 0 }
  - node: footballClub
    age: 4
    alts: [learnsToSwim, aDanceClass]
  - node: schoolTeam
    age: 9
    alts: [triesClimbing, learnsToSkateboard]
    echoes: [footballClub]
  - node: trainsHard
    age: 11
    alts: [takesUpRunning, kitchenExperiments]
  - node: scoutWatches
    age: 13
    line: "A scout watches him score. Luck!"
    echoes: [trainsHard]
  - node: youthAcademy
    age: 14
    alts: [captainsTheTeam, dramaClub]
    echoes: [scoutWatches]
  - node: winsRegionalMedal
    age: 16
    line: "He wins a medal at the regional games."
    echoes: [trainsHard]
  - node: kneeInjury
    age: 17
    line: "A bad knee injury stops him for months."
  - node: restsAndRebuilds
    age: 18
    label: Rebuilds slowly
    move: 1
    alts: [switchesSport, takesBreakFromSport]
  - node: coachKids
    age: 20
    alts: [physio, goesToUniversity]
    echoes: [footballClub]
  - node: coachingCourse
    age: 23
    alts: [becomesPersonalTrainer, startsWorking]
    echoes: [coachKids]
  - node: coachesAClub
    age: 27
    line: "A club asks him to coach its senior side."
    move: 1
    alts: [refereesMatches, joinsWeekendLeague]
    echoes: [coachingCourse]
  - node: becomesParent
    age: 32
  - node: coachesTownTeam
    age: 41
    label: Coaches a town team
    alts: [trainsForMarathon, learnsSomethingNew]
    echoes: [coachKids]
