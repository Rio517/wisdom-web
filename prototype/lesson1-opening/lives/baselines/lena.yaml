# Lena: maths, a steady rise with one hard fall at 18, a new course, learning
# that keeps building, and a late lucky break.
# The schema is in ../README.md.

id: lena
name: Lena
pronoun: she
end: 42
steps:
  - { node: born, age: 0 }
  - node: puzzlesAndBlocks
    age: 4
    alts: [footballClub, singsAtHome]
  - node: mathsClub
    age: 8
    alts: [chessClub, tryGymnastics]
    echoes: [puzzlesAndBlocks]
  - node: mathsTournament
    age: 11
    alts: [roboticsClub, secondLanguage]
    echoes: [mathsClub]
  - node: teacherSpotsTalent
    age: 13
    echoes: [mathsTournament]
  - node: scienceSubjects
    age: 15
    alts: [debateTeam, dramaClub]
    echoes: [teacherSpotsTalent]
  - node: failsAnExam
    age: 18
  - node: studiesStatistics
    age: 19
    label: Switches to statistics
    line: "She switches to statistics, the maths of what is likely."
    alts: [retakesTheExam, asksForHelp]
    echoes: [mathsClub]
  - node: worksWithData
    age: 23
    move: 1
    alts: [measuresRiverWater, startsWorking]
    echoes: [studiesStatistics]
  - node: codingCourse
    age: 28
    alts: [mentorsSomeone, takesBigProject]
    echoes: [worksWithData]
  - node: becomesParent
    age: 32
    move: 1
  - node: oldFriendJob
    age: 34
    line: "An old friend asks her to lead a data team. Luck!"
    echoes: [worksWithData, codingCourse]
  - node: runsMathsClub
    age: 38
    echoes: [mathsClub]
  - node: learnsSomethingNew
    age: 42
    label: Learns the cello
    line: "She starts the cello, badly and happily."
