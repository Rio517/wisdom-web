# Caring runs: a short burst of trying again (the README's "Runs").

- id: careExam
  label: Retakes a care exam
  steps: [sitsCareExam, failsCareExam, studiesWithFriend, passesCareExam]
  span: 2

- id: busyWard
  label: Moves ward after a hard start
  steps: [startsBusyWard, wardShortStaffed, asksSeniorNurse, movesToOtherWard]
  span: 2

- id: courseWaitingList
  label: Waits for a course place
  steps: [appliesForCareCourse, courseFull, helpsAtCareHome, waitingListPlace]
  span: 2
