# Art runs: a short burst of trying again (the README's "Runs").

# Win: art school says no, a new portfolio, a second application, a place.
- id: artSchoolSecondTry
  label: Art school, second try
  steps: [appliesToArtSchool, artSchoolSaysNo, buildsNewPortfolio, appliesAgain, artPlaceSecondTry]
  span: 2

# Change of course: art school says no, a printmaking class, a print shop job.
- id: artSchoolNewRoute
  label: Art school, new route
  steps: [appliesToArtSchool, artSchoolSaysNo, eveningPrintClass, worksInPrintShop]
  span: 2

# Partial win: rain spoils the work, a fresh start, a small show.
- id: firstShow
  label: First show
  steps: [plansFirstShow, workRuined, startsAgain, smallShowOpens]
  span: 2
